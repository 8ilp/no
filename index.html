<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>أداة يوسف الاحترافية</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script></head><body class="bg-[#0b0f19] text-gray-100 font-sans min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-2xl bg-[#111827] p-6 rounded-2xl shadow-2xl border border-gray-800/80"><div class="text-center mb-6"><h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">أداة يوسف الاحترافية</h1><p class="text-xs text-gray-400 mt-1">منصة متكاملة للتشفير والترميز وفك الحماية</p></div><div class="mb-5 p-4 bg-[#1f2937]/50 rounded-xl border border-gray-800"><h2 class="text-sm font-bold mb-3 text-indigo-300 flex items-center gap-2"><span>🔒</span> قسم التشفير المتقدم</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3"><div><label class="block text-[11px] text-gray-400 mb-1">نوع التشفير</label><select id="encType" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2 text-xs text-white"><option value="aes">AES-256 (بمفتاح سري)</option><option value="base64">Base64</option><option value="hex">HEX</option><option value="reverse">عكس النص (Reverse)</option><option value="rot13">ROT13</option><option value="binary">ترميز الثنائي (Binary)</option></select></div><div><label class="block text-[11px] text-gray-400 mb-1">المفتاح السري</label><div class="flex gap-2"><input type="text" id="secretKey" value="Key2026" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2 text-xs text-indigo-300 font-mono"><button onclick="generateRandomKey()" class="bg-indigo-600 hover:bg-indigo-500 px-3 rounded-lg font-bold text-xs">🎲 توليد</button></div></div></div><div class="mb-3"><label class="block text-[11px] text-gray-400 mb-1">النص أو السكربت</label><textarea id="inputScript" rows="3" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2.5 text-xs text-green-400 font-mono resize-none" placeholder="اكتب أو ألصق السكربت هنا..."></textarea></div><div class="flex flex-wrap gap-2 mb-3"><button onclick="encryptScript()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold text-xs">تشفير بالأداة</button><button onclick="encryptAllTogether()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg font-bold text-xs">⚡ تشفير شامل دمج</button><button onclick="copyText('outputScript')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-xs">نسخ</button></div><div><label class="block text-[11px] text-gray-400 mb-1">النتيجة المشفرة</label><textarea id="outputScript" rows="3" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2.5 text-xs text-yellow-400 font-mono resize-none" readonly></textarea></div></div><div class="p-4 bg-[#1f2937]/50 rounded-xl border border-gray-800"><h2 class="text-sm font-bold mb-3 text-emerald-400 flex items-center gap-2"><span>🔓</span> أدوات فك التشفير (12 أداة)</h2><div class="mb-3"><select id="decType" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2 text-xs text-white font-bold"><option value="base64">1. Base64 Decode</option><option value="hex">2. HEX Decode</option><option value="url">3. URL Decode</option><option value="reverse">4. عكس النص (Reverse)</option><option value="rot13">5. ROT13 Cipher</option><option value="binary">6. فك ترميز الثنائي (Binary)</option><option value="html">7. HTML Entities Decode</option><option value="eval_clean">8. تنظيف Eval / Unescape</option><option value="ascii_shift">9. فك إزاحة الأكواد (-1 Shift)</option><option value="base64_twice">10. Base64 مرتين (Double)</option><option value="char_code">11. فك CharCode/String.from</option><option value="unicode">12. فك رموز Unicode (\uXXXX)</option></select></div><div class="mb-3"><textarea id="inputDecryptScript" rows="3" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2.5 text-xs text-red-400 font-mono resize-none" placeholder="ألصق كود الشخص المشفر هنا..."></textarea></div><div class="flex gap-2 mb-3"><button onclick="decryptTargetScript()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-bold text-xs">فك التشفير الآن</button><button onclick="copyText('outputDecryptScript')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-xs">نسخ</button></div><div><textarea id="outputDecryptScript" rows="3" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2.5 text-xs text-green-400 font-mono resize-none" readonly></textarea></div></div></div><script>function generateRandomKey(){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';let key='';for(let i=0;i<16;i++){key+=chars.charAt(Math.floor(Math.random()*chars.length));}document.getElementById('secretKey').value=key;}function stringToHex(str){let hex='';for(let i=0;i<str.length;i++){hex+=str.charCodeAt(i).toString(16).padStart(2,'0');}return hex;}function hexToString(hex){let str='';for(let i=0;i<hex.length;i+=2){str+=String.fromCharCode(parseInt(hex.substr(i,2),16));}return str;}function stringToBinary(str){return str.split('').map(char=>char.charCodeAt(0).toString(2).padStart(8,'0')).join(' ');}function encryptScript(){const input=document.getElementById('inputScript').value;const type=document.getElementById('encType').value;const key=document.getElementById('secretKey').value;if(!input){alert('أدخل السكربت!');return;}let res="";try{if(type==='aes')res=CryptoJS.AES.encrypt(input,key).toString();else if(type==='base64')res=btoa(encodeURIComponent(input));else if(type==='hex')res=stringToHex(input);else if(type==='reverse')res=input.split('').reverse().join('');else if(type==='rot13')res=input.replace(/[a-zA-Z]/g,function(c){return String.fromCharCode((c<='Z'?90:122)>=(c=c.charCodeAt(0)+13)?c:c-26);});else if(type==='binary')res=stringToBinary(input);document.getElementById('outputScript').value=res;}catch(e){alert('خطأ');}}function encryptAllTogether(){const input=document.getElementById('inputScript').value;const key=document.getElementById('secretKey').value;if(!input){alert('أدخل السكربت!');return;}try{let step1=input.split('').reverse().join('');let step2=btoa(encodeURIComponent(step1));let step3=stringToHex(step2);let finalRes=CryptoJS.AES.encrypt(step3,key).toString();document.getElementById('outputScript').value=finalRes;}catch(e){alert('خطأ');}}function decryptTargetScript(){const input=document.getElementById('inputDecryptScript').value.trim();const type=document.getElementById('decType').value;if(!input){alert('أدخل الكود!');return;}let dec="";try{if(type==='base64')dec=decodeURIComponent(atob(input));else if(type==='hex')dec=hexToString(input);else if(type==='url')dec=decodeURIComponent(input);else if(type==='reverse')dec=input.split('').reverse().join('');else if(type==='rot13')dec=input.replace(/[a-zA-Z]/g,function(c){return String.fromCharCode((c<='Z'?90:122)>=(c=c.charCodeAt(0)+13)?c:c-26);});else if(type==='binary')dec=input.replace(/\s+/g,'').match(/.{1,8}/g).map(b=>String.fromCharCode(parseInt(b,2))).join('');else if(type==='html'){let doc=new DOMParser().parseFromString(input,'text/html');dec=doc.documentElement.textContent;}else if(type==='eval_clean')dec=input.replace(/eval\s*\(/g,'print(').replace(/unescape\s*\(/g,'');else if(type==='ascii_shift')dec=input.split('').map(c=>String.fromCharCode(c.charCodeAt(0)-1)).join('');else if(type==='base64_twice')dec=decodeURIComponent(atob(decodeURIComponent(atob(input))));else if(type==='char_code'){let matches=input.match(/\d+/g);dec=matches?matches.map(n=>String.fromCharCode(parseInt(n))).join(''):"لا توجد رموز";}else if(type==='unicode')dec=input.replace(/\\u[\dA-F]{4}/gi,match=>String.fromCharCode(parseInt(match.replace(/\\u/g,''),16)));document.getElementById('outputDecryptScript').value=dec||"فشل الفك";}catch(e){document.getElementById('outputDecryptScript').value="خطأ";}}function copyText(id){const el=document.getElementById(id);el.select();document.execCommand('copy');alert('تم النسخ!');}</script></body></html>
