<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة يوسف الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-[#111827] p-6 rounded-2xl shadow-2xl border border-gray-800/80">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-indigo-400">أداة يوسف للحماية</h1>
        </div>
        
        <!-- قسم التشفير -->
        <div class="mb-5 p-4 bg-[#1f2937]/50 rounded-xl border border-gray-800">
            <h2 class="text-sm font-bold mb-3 text-indigo-300">🔒 قسم التشفير والتشويش</h2>
            <div class="mb-3">
                <select id="encType" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2 text-xs text-white mb-3">
                    <option value="bytecode_vm">تشفير افتراضي مدمر (VM Protection) - الأقوى</option>
                    <option value="heavy_obfuscate">تشويش رموز متطرف (Heavy Obfuscation)</option>
                    <option value="base64">تشفير Base64 (بسيط)</option>
                    <option value="reverse">عكس النص</option>
                </select>
                <textarea id="inputScript" rows="4" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2.5 text-xs text-green-400 font-mono resize-none" placeholder="اكتب سكربت روبلوكس هنا..."></textarea>
            </div>
            <div class="flex flex-wrap gap-2 mb-3">
                <button onclick="encryptScript()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold text-xs transition">تشفير السكربت</button>
                <button onclick="copyText('outputScript')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-xs transition">نسخ النتيجة</button>
            </div>
            <div>
                <textarea id="outputScript" rows="4" class="w-full bg-[#111827] border border-gray-700 rounded-lg p-2.5 text-xs text-yellow-400 font-mono resize-none" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        function encryptScript() {
            const input = document.getElementById('inputScript').value;
            const type = document.getElementById('encType').value;
            if (!input) return;

            let res = "";
            try {
                if (type === 'bytecode_vm') {
                    // نظام حماية VM Bytecode
                    let encoded = '';
                    for (let i = 0; i < input.length; i++) {
                        let code = input.charCodeAt(i) ^ 0x5A;
                        encoded += '\\' + code;
                    }
                    res = `-- [Protected by Youssef VM Engine]\nlocal _VM_Data = "${encoded}"\nlocal _Res = ""; for i = 2, #_VM_Data, 4 do _Res = _Res .. string.char(tonumber(_VM_Data:sub(i, i+2)) ~= 0x5A) end; loadstring(_Res)();`;
                } 
                else if (type === 'heavy_obfuscate') {
                    // تشويش متطرف
                    let chars = input.split('').map(c => c.charCodeAt(0) ^ 0xA5).join(',');
                    res = `local _0xData={${chars}}; local _0xStr=""; for _,v in ipairs(_0xData) do _0xStr=_0xStr..string.char(v ~= 0xA5); end; loadstring(_0xStr)();`;
                }
                else if (type === 'base64') {
                    res = `loadstring(game:HttpGet("data:text/plain;base64," .. "${btoa(input)}"))()`;
                }
                else if (type === 'reverse') {
                    res = input.split('').reverse().join('');
                }
                document.getElementById('outputScript').value = res;
            } catch (e) {
                document.getElementById('outputScript').value = "خطأ في التشفير!";
            }
        }

        function copyText(id) {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            alert("تم النسخ!");
        }
    </script>
</body>
</html>
